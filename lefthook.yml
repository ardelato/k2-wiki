pre-commit:
  commands:
    format:
      glob: '*.{ts,tsx,vue,css,json}'
      run: npx oxfmt {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,tsx,vue}'
      run: npx oxlint -c oxlintrc.json --vue-plugin --fix {staged_files}
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      run: npx vue-tsc -b
    knip:
      run: npx knip
    i18n-frozen:
      run: node scripts/sync-frozen-locales.mjs --check
    i18n-check:
      run: node scripts/check-i18n.mjs
